# Overrides merged on top of cloud-game's default config (pkg/config/config.yaml upstream).
emulator:
  libretro:
    cores:
      list:
        # LRPS2 (PCSX2 for libretro). Needs an OpenGL context: cloud-game creates it via GLX on Xvfb.
        # BIOS: library/bios/ps2/*.bin -> libretro/system/pcsx2/bios (see docker-compose.yml)
        ps2:
          lib: pcsx2_libretro
          folder: ps2
          roms: ["iso", "chd", "cso", "zso", "ciso", "m3u", "cue", "elf"]  # as reported by the core
          isGlAllowed: true
          vfr: true
          # Upstream cloud-game called context_destroy after retro_deinit and LRPS2 spun forever, hanging the worker on
          # close. stream/cloud-game.patch now calls it first, like RetroArch, but that is untested with LRPS2: kept.
          # vulkan: the patch's Vulkan frontend is offered to this core. Its renderer stays "Auto": LRPS2 asks which API
          # the frontend prefers, Vulkan where a Vulkan GPU exists (the NVIDIA host), OpenGL elsewhere (WSL2).
          # paraLLEl-GS, the low-level renderer, is Vulkan only: pick it per game from the in-game menu.
          hacks: ["skip_hw_context_destroy", "vulkan"]
          # cloud-game passes only these options to the core (no defaults), so the BIOS must be named here
          options:
            pcsx2_bios: ps2-0230e-20080220.bin  # file name in library/bios/ps2
            # the DualShock 2 boots in digital mode (sticks off) and libretro has no ANALOG button to press
            pcsx2_analog_mode1: enabled
            pcsx2_analog_mode2: enabled
            # Auto asks the frontend which API it prefers (GET_PREFERRED_HW_RENDER): Vulkan with the "vulkan" hack below
            # where a Vulkan GPU exists. Unset, LRPS2 got an empty value instead of its default and went straight to
            # its fallback chain, OpenGL first.
            pcsx2_renderer: Auto
        # Dolphin (Wii). OpenGL core profile, created the same way as LRPS2's. Its Sys files are baked into the image
        # (stream/Dockerfile); its User folder (Wii NAND, game saves) is library/saves/cloud-game (docker-compose.yml).
        # The emulated RAM lives in /dev/shm, hence shm_size there: Docker's 64 MB default ends in SIGBUS.
        wii:
          lib: dolphin_libretro
          folder: wii
          roms: ["iso", "wbfs", "rvz", "gcz", "ciso", "wia"]
          isGlAllowed: true
          vfr: true
          # no skip_hw_context_destroy: without context_destroy Dolphin's shader compiler threads keep their shared GL
          # contexts alive while the worker destroys its own, and the NVIDIA driver loses the GPU (Xid 79)
          # Dolphin leaves a port empty until the frontend names a device: port 1 = Classic Controller Pro
          # ((5 << 8) | 1), a pad laid out like ours. Games that only take the Wii Remote (Need for Speed ProStreet)
          # get another one from the in-game menu's Controller panel, saved per game (retromate_device).
          hid:
            0: [1281]
          options:
            # Wii system language (Dolphin's numbering: 1 English, 2 German, 3 French, 4 Spanish, 5 Italian...).
            # This is the default; RetroMate sends the one chosen in Opzioni with each start (or the one saved for
            # the game from the in-game menu's options).
            dolphin_language: "5"
          # everything not listed keeps the core's default (Hardware renderer, native 640x528, JIT64)
        # RPCS3 (PS3). Vulkan, its main and fastest renderer, through the patch's Vulkan frontend ("vulkan" hack): RPCS3
        # renders on our device and hands each frame over as an image, which the frontend converts to XRGB8888. Its own
        # fallback (refused a frontend context, it opens the driver itself and copies frames back in memory) showed the
        # loading screen, then froze on it with the game's audio playing: it drops frames that aren't BGRA. Needs a
        # Vulkan GPU (the NVIDIA host). "opengl" (in-game menu) draws into our GLX context instead, through a shared
        # context it makes for its RSX thread. Firmware:
        # library/bios/ps3/PS3UPDAT.PUP, installed on the first start (minutes: the start waits up to 2, see the patch).
        # Its system folder (installed firmware, dev_hdd0 with the game saves, PPU/shader caches) is
        # library/saves/ps3/rpcs3 (docker-compose.yml). Decrypted ISOs, or redump ones with their .dkey beside them.
        ps3:
          lib: rpcs3_libretro
          folder: ps3
          roms: ["iso"]
          isGlAllowed: true
          vfr: true
          hacks: ["vulkan"]
          options:
            rpcs3_renderer: vulkan
            rpcs3_language: italian
            rpcs3_license_area: eu
encoder:
  # cloud-game reads the encoders from encoder.list, beside encoder.video (pkg/config: Encoder.List). Until
  # 2026-10 this sat under encoder.video and was ignored: VP8 ran on upstream's defaults.
  list:
    vp8:
      # Upstream defaults with these changes. 20 Mbit/s instead of 3.2: the stream is LAN-only and PS2 games are full
      # of fine detail. static-threshold=0 instead of 100: above it libvpx skips macroblocks that change "too little",
      # so low-contrast textures (FIFA 14's pitch) froze into 16x16 squares that were never refreshed.
      # max-quantizer=40 instead of 63 and undershoot=50 instead of 100: dark scenes and gradients (Kingdom Hearts)
      # broke into JPEG-like blocks; this caps the worst quality per frame, at the cost of overshooting the bitrate.
      params: >-
        keyframe-mode=disabled tuning=ssim cpu-used=6 target-bitrate=20000000 deadline=1 sharpness=1 end-usage=cbr
        static-threshold=0 max-quantizer=40
        error-resilient=default+partitions overshoot=20 undershoot=50
    # NVENC on the NVIDIA host (docker-compose.nvidia.yml picks it with CLOUD_GAME_ENCODER_VIDEO_CODEC=h264): the GPU
    # encodes, the CPU stays with the emulator. cloud-game writes no element for h264 (its x264 case is commented
    # out), so params start with the element itself. cloud-game's capsfilter before it says I420, which nvh264enc
    # doesn't take (NV12, Y444, VUYA, RGB only): videoconvert interleaves the chroma planes into NV12. Same 20 Mbit/s
    # as VP8; ultra-low-latency, no B-frames, no periodic keyframes (gop-size=-1: cloud-game forces one every keyframeInterval frames, SPS/PPS included);
    # vbv-buffer-size ~3 frames at 60 fps, so those keyframes aren't starved into blocks. Constrained baseline:
    # every WebRTC H.264 decoder takes it (the AUDs, which the RTP packetizer drops anyway, are off).
    h264:
      params: >-
        videoconvert n-threads=2 ! video/x-raw,format=NV12 !
        nvh264enc name=video_enc preset=p4 tune=ultra-low-latency rc-mode=cbr bitrate=20000 vbv-buffer-size=1000
        gop-size=-1 zerolatency=true repeat-sequence-header=true aud=false
      caps: video/x-h264,stream-format=byte-stream,alignment=au,profile=constrained-baseline
