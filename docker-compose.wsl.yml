# GPU rendering on Windows (Docker Desktop / WSL2): Mesa's d3d12 driver renders OpenGL on the host GPU.
# Not loaded by default: on Windows, .env (not versioned) holds COMPOSE_FILE=docker-compose.yml;docker-compose.wsl.yml
services:
  cloud-game:
    devices: [/dev/dxg]
    volumes: [/usr/lib/wsl:/usr/lib/wsl:ro]
    environment:
      - LD_LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu:/usr/lib/wsl/lib
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA # otherwise the integrated GPU may be picked
